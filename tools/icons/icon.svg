<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone do Hendrixx: metrônomo âmbar sobre o fundo escuro do app. -->
  <rect width="512" height="512" rx="112" fill="#101216" />
  <g transform="translate(256 268)">
    <!-- corpo -->
    <path d="M-104 168 L-40 -168 L40 -168 L104 168 Z" fill="none" stroke="#f2a43a" stroke-width="22" stroke-linejoin="round" />
    <!-- base -->
    <line x1="-128" y1="168" x2="128" y2="168" stroke="#f2a43a" stroke-width="22" stroke-linecap="round" />
    <!-- haste inclinada com o peso -->
    <g transform="rotate(24 0 120)">
      <line x1="0" y1="120" x2="0" y2="-150" stroke="#eef0f4" stroke-width="18" stroke-linecap="round" />
      <rect x="-30" y="-74" width="60" height="44" rx="10" fill="#f2a43a" />
    </g>
  </g>
</svg>
