<header class="top">
  <a class="brand" routerLink="/">Hendrixx</a>
  <div class="naming" role="group" aria-label="Nomes dos acordes">
    <button
      type="button"
      [attr.aria-pressed]="naming.naming() === 'cifra'"
      (click)="naming.set('cifra')"
      title="Cifra"
    >
      C
    </button>
    <button
      type="button"
      [attr.aria-pressed]="naming.naming() === 'pt'"
      (click)="naming.set('pt')"
      title="Português"
    >
      Dó
    </button>
  </div>
</header>
<app-update-banner />
<main>
  <router-outlet />
</main>
